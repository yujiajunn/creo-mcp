[project]
name = "creo-mcp"
version = "0.10.0"
description = "A standard MCP bridge for PTC Creo through its official VB API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.30,<2",
  "pywin32>=308; sys_platform == 'win32'",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project.scripts]
creo-mcp = "creo_mcp.server:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
