[project]
name = "creo-mcp"
version = "0.16.0"
description = "A standard MCP bridge for PTC Creo through its official VB API"
readme = "README.md"
# PEP 639：用 SPDX 字符串 + license-files，不再用已废弃的 License 分类符。
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["creo", "mcp", "cad", "parametric", "vb-api", "ptc"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: Manufacturing",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Computer-Aided Design (CAD)",
]
dependencies = [
  "mcp>=1.30,<2",
  "pywin32>=308; sys_platform == 'win32'",
  "pillow>=11,<13",
]

[project.optional-dependencies]
concept-geometry = [
  "cadquery-ocp-novtk>=7.9.3.1,<7.9.4",
]
dev = [
  "pytest>=8",
  # 锁到基线算出来那一版：新版本的 UP/I/E 族会陆续新增规则，
  # 让本来 0 命中的门禁在某天突然变红，且本地与 runner 结果不一致。
  "ruff>=0.17,<0.18",
  "build>=1.2",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project.scripts]
creo-mcp = "creo_mcp.server:main"

[project.urls]
Homepage = "https://github.com/yujiajunn/creo-mcp"
Repository = "https://github.com/yujiajunn/creo-mcp"
Issues = "https://github.com/yujiajunn/creo-mcp/issues"

[tool.setuptools.package-data]
creo_mcp = ["docs/*.md"]

[tool.ruff]
line-length = 100
target-version = "py311"

# 显式规则集：无配置文件时 ruff 的隐式选集随版本漂移（0.17 会额外启用 BLE001/SIM/S
# 等，导致同一份代码在不同 runner 上报出不同数量的错），CI 门禁必须钉死。
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "BLE"]

# BLE001（宽 catch）只在"降级即契约"的模块逐文件豁免：COM/子进程边界抛的是异常杂集
# （com_error、晚期绑定的 AttributeError、OSError…），收窄会把干净的 CreoMcpError
# 变成裸栈；渲染与日志写入失败必须退回裸结果而不是打断调用方。新模块默认受检。
[tool.ruff.lint.per-file-ignores]
"creo_mcp/bridge.py" = ["BLE001", "B905"]
"creo_mcp/server.py" = ["BLE001"]
"creo_mcp/broker.py" = ["BLE001"]
"creo_mcp/preview_render.py" = ["BLE001"]
"creo_mcp/observability.py" = ["BLE001"]
"creo_mcp/clearance_geometry.py" = ["BLE001", "B905"]
"creo_mcp/cavity_segments.py" = ["B905"]
"tests/test_cavity_segments.py" = ["B905"]

# 未纳入门禁的家族（不是静默放行，是具名欠债，下一轮按数清理）：
#   B905 zip 缺 strict=     8 处 —— 需要逐处确认是否等长前提，改 strict=True 会变语义
#   SIM105 可用 suppress    18 处、SIM117 嵌套 with  7 处（多在测试）
#   S110 try/except/pass    10 处、S112 .../continue 2 处（清理路径的有意吞异常）
# 全部由 ruff check --select B905,SIM,S 复现。

[tool.pytest.ini_options]
testpaths = ["tests"]
